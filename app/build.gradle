plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.notelab'
    compileSdk 36
    defaultConfig {
        applicationId 'com.example.notelab'
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName '1.0.1'
        testApplicationId 'com.example.notelab.tests'
        testInstrumentationRunner 'com.example.notelab.SmokeTests'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
    sourceSets {
        androidTest {
            java.srcDirs = ['../tests']
            manifest.srcFile '../tests/AndroidManifest.xml'
        }
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('build/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
