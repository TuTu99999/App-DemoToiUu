plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.notelab'
    compileSdk 36
    defaultConfig {
        applicationId 'com.example.notelab'
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName '1.0.1'
        testApplicationId 'com.example.notelab.tests'
        testInstrumentationRunner 'com.example.notelab.SmokeTests'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
    sourceSets {
        androidTest {
            java.srcDirs = ['../tests']
            manifest.srcFile '../tests/AndroidManifest.xml'
        }
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('build/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

def debugKeystoreFile = rootProject.file('build/debug.keystore')

def ensureDebugKeystore = tasks.register('ensureDebugKeystore', Exec) {
    outputs.file(debugKeystoreFile)
    onlyIf { !debugKeystoreFile.exists() }
    doFirst {
        debugKeystoreFile.parentFile.mkdirs()
    }
    def isWin = System.getProperty('os.name').toLowerCase().contains('win')
    def keytoolPath = new File(System.getProperty('java.home'), isWin ? 'bin/keytool.exe' : 'bin/keytool').absolutePath
    commandLine(
        keytoolPath, '-genkeypair',
        '-keystore', debugKeystoreFile.absolutePath,
        '-storepass', 'android',
        '-keypass', 'android',
        '-alias', 'androiddebugkey',
        '-dname', 'CN=NoteLab Debug',
        '-keyalg', 'RSA',
        '-validity', '10000'
    )
}

tasks.configureEach {
    if (name == 'validateSigningDebug' || name == 'validateSigningDebugAndroidTest') {
        dependsOn(ensureDebugKeystore)
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
